name: Deploy

on:
  pull_request:
    paths:
      - opentofu/project/**
      - .github/workflows/deploy.yml
  push:
    branches: [main]
    paths:
      - opentofu/project/**
      - .github/workflows/deploy.yml

defaults:
  run:
    working-directory: opentofu/project

env:
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  # S3 backend only ever reads these two exact names, regardless of how the
  # secrets are named — see opentofu/project/backend.tofu.
  AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}

concurrency:
  group: opentofu

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          # Must stay >= 1.10 — backend.tofu relies on use_lockfile (native S3
          # locking), which required_version in versions.tofu also enforces.
          tofu_version: 1.12.6

      - name: tofu init
        run: tofu init -input=false -no-color

      - name: tofu plan
        run: tofu plan -input=false -no-color

  apply:
    runs-on: ubuntu-latest
    environment: production
    needs: plan
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6

      - name: tofu init
        run: tofu init -input=false -no-color

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve
