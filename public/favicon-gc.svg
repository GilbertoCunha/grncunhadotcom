<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Matches the site title: Starlight's system font and accent text colour,
	     light by default and the dark-theme shade when the system is dark -->
	<style>
		text { fill: #3d50f5; }
		@media (prefers-color-scheme: dark) { text { fill: #b3c7ff; } }
	</style>
	<text x="16" y="21" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="-0.5"
		font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">gc</text>
</svg>
